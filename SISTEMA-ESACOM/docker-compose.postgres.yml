name: esacom-titulo

services:

  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-esacom}
      POSTGRES_USER: ${POSTGRES_USER:-esacom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define_POSTGRES_PASSWORD_en_.env.docker}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-esacom} -d ${POSTGRES_DB:-esacom}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - esacom_internal


  redis:
    image: redis:7-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped

    networks:
      - esacom_internal


  backend:
    build:
      context: ./esacom_backend

    env_file:
      - ./esacom_backend/.env

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-esacom}
      DB_USER: ${POSTGRES_USER:-esacom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define_POSTGRES_PASSWORD_en_.env.docker}

      DATABASE_URL: "postgresql://${POSTGRES_USER:-esacom}:${POSTGRES_PASSWORD:?Define_POSTGRES_PASSWORD_en_.env.docker}@db:5432/${POSTGRES_DB:-esacom}"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"

      ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend

      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081

      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"

      RUN_MIGRATIONS: "1"

    volumes:
      - ./esacom_backend/credentials:/app/credentials:ro
      - ./data:/app/data

    ports:
      - "127.0.0.1:8001:8000"

    depends_on:
      db:
        condition: service_healthy

      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).read()"
        ]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s

    restart: unless-stopped

    networks:
      - esacom_internal


  worker:
    build:
      context: ./esacom_backend

    command:
      [
        "celery",
        "-A",
        "esacom_backend.celery:app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2"
      ]

    env_file:
      - ./esacom_backend/.env

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-esacom}
      DB_USER: ${POSTGRES_USER:-esacom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define_POSTGRES_PASSWORD_en_.env.docker}

      DATABASE_URL: "postgresql://${POSTGRES_USER:-esacom}:${POSTGRES_PASSWORD:?Define_POSTGRES_PASSWORD_en_.env.docker}@db:5432/${POSTGRES_DB:-esacom}"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"

      RUN_MIGRATIONS: "0"

    volumes:
      - ./esacom_backend/credentials:/app/credentials:ro
      - ./data:/app/data

    depends_on:
      backend:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - esacom_internal


  beat:
    build:
      context: ./esacom_backend

    command:
      [
        "celery",
        "-A",
        "esacom_backend.celery:app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule"
      ]

    env_file:
      - ./esacom_backend/.env

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-esacom}
      DB_USER: ${POSTGRES_USER:-esacom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Define_POSTGRES_PASSWORD_en_.env.docker}

      DATABASE_URL: "postgresql://${POSTGRES_USER:-esacom}:${POSTGRES_PASSWORD:?Define_POSTGRES_PASSWORD_en_.env.docker}@db:5432/${POSTGRES_DB:-esacom}"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"

      RUN_MIGRATIONS: "0"

    volumes:
      - ./esacom_backend/credentials:/app/credentials:ro
      - ./data:/app/data

    depends_on:
      backend:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - esacom_internal


  frontend:
    build:
      context: ./esacom_frontend

      args:
        VITE_API_URL: /api

    ports:
      - "8081:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - esacom_internal


volumes:

  postgres_data:

  redis_data:


networks:

  esacom_internal:
    driver: bridge