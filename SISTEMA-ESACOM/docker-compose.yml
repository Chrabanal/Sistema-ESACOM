name: esacom-crm-uat

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [esacom_internal]

  backend:
    build:
      context: ./esacom_backend
    env_file:
      - ./esacom_backend/.env
    environment:
      DATABASE_URL: sqlite:////app/db.sqlite3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
      RUN_MIGRATIONS: "1"
    volumes:
      - ./esacom_backend/db.sqlite3:/app/db.sqlite3
      - ./esacom_backend/credentials:/app/credentials:ro
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [esacom_internal]

  frontend:
    build:
      context: ./esacom_frontend
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [esacom_internal]

  # SQLite no se recomienda para escrituras concurrentes de backend + Celery.
  worker:
    profiles: ["automation"]
    build:
      context: ./esacom_backend
    command: ["celery", "-A", "esacom_backend", "worker", "--loglevel=INFO", "--concurrency=1"]
    env_file:
      - ./esacom_backend/.env
    environment:
      DATABASE_URL: sqlite:////app/db.sqlite3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      RUN_MIGRATIONS: "0"
    volumes:
      - ./esacom_backend/db.sqlite3:/app/db.sqlite3
      - ./esacom_backend/credentials:/app/credentials:ro
      - ./data:/app/data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [esacom_internal]

  beat:
    profiles: ["automation"]
    build:
      context: ./esacom_backend
    command: ["celery", "-A", "esacom_backend", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    env_file:
      - ./esacom_backend/.env
    environment:
      DATABASE_URL: sqlite:////app/db.sqlite3
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      RUN_MIGRATIONS: "0"
    volumes:
      - ./esacom_backend/db.sqlite3:/app/db.sqlite3
      - ./esacom_backend/credentials:/app/credentials:ro
      - ./data:/app/data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [esacom_internal]

volumes:
  redis_data:

networks:
  esacom_internal:
    driver: bridge
